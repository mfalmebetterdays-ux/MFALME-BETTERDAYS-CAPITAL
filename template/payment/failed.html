{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed - Mfalme Betterdays Capital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .failed-card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }

        .failed-icon {
            width: 80px;
            height: 80px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .failed-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 1rem;
            margin-bottom: 32px;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #059669;
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: #047857;
        }

        .btn-secondary {
            background: white;
            color: #374151;
            border: 1.5px solid #e5e7eb;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #f9fafb;
        }

        .help-text {
            margin-top: 24px;
            font-size: 0.85rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="failed-card">
        <div class="failed-icon">
            <svg viewBox="0 0 24 24">
                <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>

        <h1>Payment Failed</h1>
        <div class="subtitle">Your transaction could not be completed</div>

        <div class="error-message">
            {{ error_message|default:"The payment was unsuccessful. Please try again." }}
        </div>

        <div class="action-buttons">
            <a href="javascript:history.back()" class="btn btn-primary">
                <span>Try Again</span>
            </a>
            <a href="{% url 'contact' %}" class="btn btn-secondary">
                <span>Contact Support</span>
            </a>
        </div>

        <div class="help-text">
            Need help? <a href="{% url 'contact' %}" style="color: #059669;">Contact us</a>
        </div>
    </div>
</body>
</html>

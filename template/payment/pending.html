{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Payment Pending - Mfalme Betterdays Capital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .pending-card {
            width: 100%;
            max-width: 380px;
            background: white;
            border-radius: 28px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.15);
        }

        @media (min-width: 1280px) {
            .pending-card {
                max-width: 360px;
                padding: 28px 22px;
                border-radius: 24px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .pending-card {
                padding: 28px 20px;
                border-radius: 24px;
            }
        }

        .pending-icon {
            width: 64px;
            height: 64px;
            background: #f59e0b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: pulse 2s infinite;
        }

        @media (max-width: 480px) {
            .pending-icon {
                width: 56px;
                height: 56px;
                margin-bottom: 16px;
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .pending-icon svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 650;
            color: #111827;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #f59e0b;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 16px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-message {
            background: #fef3c7;
            color: #92400e;
            padding: 14px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .reference {
            font-family: monospace;
            background: #f3f4f6;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #374151;
            font-size: 0.85rem;
            word-break: break-all;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-block;
            background: white;
            color: #374151;
            border: 1.5px solid #e5e7eb;
            width: 100%;
        }

        .btn:hover {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        .auto-refresh-note {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="pending-card">
        <div class="pending-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 8v4l3 3M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z" stroke="white" stroke-width="2" fill="none"/>
            </svg>
        </div>

        <h1>Payment Pending</h1>
        <div class="subtitle">Your transaction is being processed</div>

        <div class="loader"></div>

        <div class="info-message">
            Please wait while we confirm your payment. This may take a few moments.
        </div>

        <div class="reference">
            {{ reference }}
        </div>

        <a href="{% url 'dashboard' %}" class="btn">
            Go to Dashboard
        </a>

        <div class="auto-refresh-note">
            Auto-refreshing in 5 seconds...
        </div>

        <script>
            setTimeout(function() {
                window.location.reload();
            }, 5000);
        </script>
    </div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Payment Failed - Mfalme Betterdays Capital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .failed-card {
            width: 100%;
            max-width: 380px; /* Smaller default */
            background: white;
            border-radius: 28px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.15);
        }

        @media (min-width: 1280px) {
            .failed-card {
                max-width: 360px;
                padding: 28px 22px;
                border-radius: 24px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .failed-card {
                padding: 28px 20px;
                border-radius: 24px;
            }
        }

        .failed-icon {
            width: 64px;
            height: 64px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        @media (max-width: 480px) {
            .failed-icon {
                width: 56px;
                height: 56px;
                margin-bottom: 16px;
            }
        }

        .failed-icon svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 650;
            color: #111827;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .action-buttons {
                flex-direction: column;
                gap: 8px;
            }
        }

        .btn {
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            flex: 1;
        }

        .btn-primary {
            background: #059669;
            color: white;
        }

        .btn-primary:hover {
            background: #047857;
        }

        .btn-secondary {
            background: white;
            color: #374151;
            border: 1.5px solid #e5e7eb;
        }

        .btn-secondary:hover {
            background: #f9fafb;
        }

        .help-text {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .help-text a {
            color: #059669;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="failed-card">
        <div class="failed-icon">
            <svg viewBox="0 0 24 24">
                <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>

        <h1>Payment Failed</h1>
        <div class="subtitle">Your transaction could not be completed</div>

        <div class="error-message">
            {{ error_message|default:"The payment was unsuccessful. Please try again." }}
        </div>

        <div class="action-buttons">
            <a href="javascript:history.back()" class="btn btn-primary">
                Try Again
            </a>
            <a href="{% url 'contact' %}" class="btn btn-secondary">
                Support
            </a>
        </div>

        <div class="help-text">
            Need help? <a href="{% url 'contact' %}">Contact us</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBC Admin Login</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <style>
        /* YOUR EXACT COLORS - UNCHANGED */
        :root {
            --black: #000000;
            --white: #FFFFFF;
            --blue: #0066CC;
            --green: #10B981;
            --yellow: #F59E0B;
            --red: #EF4444;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--gray-100);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .login-container {
            background: var(--white);
            width: 380px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid var(--gray-200);
            transition: all 0.3s ease;
        }
        
        /* ONLY ADDED: Success state styling */
        .login-container.success {
            border: 2px solid var(--green);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            width: 70px;
            height: 70px;
            background: var(--black);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            transition: transform 0.3s ease;
        }
        
        /* ONLY ADDED: Logo animation on success */
        .logo-icon.success {
            animation: logoPop 0.5s ease;
        }
        
        @keyframes logoPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .logo-icon i {
            font-size: 32px;
            color: var(--white);
        }
        
        .logo h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 5px;
        }
        
        .logo p {
            font-size: 13px;
            color: var(--gray-500);
        }
        
        .alert {
            background: #FEF2F2;
            border: 1px solid var(--red);
            color: var(--red);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 6px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 14px;
            transition: color 0.3s;
        }
        
        input {
            width: 100%;
            padding: 12px 40px 12px 40px;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--blue);
        }
        
        /* ONLY ADDED: Error state for inputs */
        input.error {
            border-color: var(--red);
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            cursor: pointer;
            background: none;
            border: none;
            font-size: 14px;
        }
        
        .toggle-password:hover {
            color: var(--blue);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--blue);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .login-btn:hover {
            background: var(--gray-800);
        }
        
        .login-btn i {
            font-size: 14px;
            transition: transform 0.3s;
        }
        
        .login-btn:hover i {
            transform: translateX(5px);
        }
        
        /* ONLY ADDED: Loading state for button */
        .login-btn.loading {
            background: var(--gray-400);
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .login-btn.loading i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* ONLY ADDED: Success checkmark animation */
        .success-checkmark {
            display: none;
            text-align: center;
            margin: 20px 0;
            animation: fadeInUp 0.5s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .checkmark {
            width: 60px;
            height: 60px;
            background: var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            animation: scaleIn 0.3s ease;
        }
        
        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        
        .checkmark i {
            font-size: 30px;
            color: white;
            animation: checkPop 0.3s ease 0.2s both;
        }
        
        @keyframes checkPop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        
        .success-text {
            color: var(--green);
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .redirect-text {
            color: var(--gray-500);
            font-size: 13px;
        }
        
        .back-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--gray-200);
        }
        
        .back-link a {
            color: var(--gray-500);
            text-decoration: none;
            font-size: 13px;
        }
        
        .back-link a:hover {
            color: var(--blue);
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon" id="logoIcon">
                <i class="fas fa-lock"></i>
            </div>
            <h2>MBC ADMIN</h2>
            <p>Mfalme Betterdays Capital</p>
        </div>
        
        <!-- Error alert -->
        <div class="alert" id="errorAlert">
            <i class="fas fa-exclamation-circle"></i> <span id="errorMsg">Invalid credentials</span>
        </div>
        
        <!-- Success animation (hidden by default) -->
        <div class="success-checkmark" id="successAnimation">
            <div class="checkmark">
                <i class="fas fa-check"></i>
            </div>
            <div class="success-text">Login Successful!</div>
            <div class="redirect-text">Redirecting to dashboard...</div>
        </div>
        
        <!-- Login form -->
        <form id="loginForm" method="POST" action="/admin/login/">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" name="username" id="username" placeholder="Enter username" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-key input-icon"></i>
                    <input type="password" name="password" id="password" placeholder="Enter password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="far fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                <span>LOGIN</span> <i class="fas fa-arrow-right"></i>
            </button>
        </form>
        
        <!-- Back to site -->
        <div class="back-link">
            <a href="/"><i class="fas fa-chevron-left"></i> back to site</a>
        </div>
    </div>
    
    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
        
        // Get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        const csrftoken = getCookie('csrftoken');
        
        // Handle form submission
        $('#loginForm').on('submit', function(e) {
            e.preventDefault();
            
            const username = $('#username').val().trim();
            const password = $('#password').val();
            const loginBtn = $('#loginBtn');
            const container = $('#loginContainer');
            const logoIcon = $('#logoIcon');
            
            // Remove any previous error states
            $('#errorAlert').hide();
            $('#username, #password').removeClass('error');
            
            // Simple validation
            if (!username || !password) {
                $('#errorMsg').text('Please enter both fields');
                $('#errorAlert').fadeIn(300);
                if (!username) $('#username').addClass('error');
                if (!password) $('#password').addClass('error');
                return;
            }
            
            // Show loading state
            loginBtn.addClass('loading');
            loginBtn.html('<i class="fas fa-spinner"></i> AUTHENTICATING...');
            
            // Make AJAX request
            $.ajax({
                url: '/admin/login/',
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrftoken
                },
                data: {
                    username: username,
                    password: password
                },
                success: function(response) {
                    if (response.success) {
                        // Show success animation
                        loginBtn.fadeOut(100);
                        $('#loginForm').fadeOut(300, function() {
                            $('#successAnimation').fadeIn(300);
                            container.addClass('success');
                            logoIcon.addClass('success');
                            
                            // Redirect after animation
                            setTimeout(function() {
                                window.location.href = response.redirect || '/admin/';
                            }, 1500);
                        });
                    } else {
                        // Reset button
                        loginBtn.removeClass('loading');
                        loginBtn.html('<span>LOGIN</span> <i class="fas fa-arrow-right"></i>');
                        
                        // Show error
                        $('#errorMsg').text(response.message || 'Invalid credentials');
                        $('#errorAlert').fadeIn(300);
                        $('#username, #password').addClass('error');
                    }
                },
                error: function(xhr) {
                    // Reset button
                    loginBtn.removeClass('loading');
                    loginBtn.html('<span>LOGIN</span> <i class="fas fa-arrow-right"></i>');
                    
                    // Show error
                    $('#errorMsg').text('Connection error. Please try again.');
                    $('#errorAlert').fadeIn(300);
                }
            });
        });
        
        // Auto-focus username
        $(document).ready(function() {
            $('#username').focus();
            
            // Remove error class on input
            $('#username, #password').on('input', function() {
                $(this).removeClass('error');
            });
        });
    </script>
</body>
</html>
